<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог</title>
<style>
:root{--ink:#1d2433;--muted:#5b6475;--line:#d5dae3;--bg:#f6f7f9;--surface:#fff;--brand:#1f5fd1;--brand-ink:#fff;--ok:#1d7a46;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.site{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header.site a{color:var(--ink);text-decoration:none;font-weight:600}
main{max-width:960px;margin:32px auto;padding:0 20px}
h1{font-size:1.6rem;margin:0 0 16px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #8fb3f5;outline-offset:2px}
.msg{margin-top:16px;padding:10px 14px;border-radius:6px;display:none}
.msg.show{display:block}
.msg.ok{background:#e3f4ea;color:var(--ok)}
.msg.err{background:#fde8e6;color:var(--err)}
.ver{font-size:.8rem;color:var(--muted)}
._UDMbWR{width:100%;border-collapse:collapse;background:var(--surface)}
._UDMbWR th,._UDMbWR td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
._crAMpo{background:var(--ink);color:#fff;border:0;border-radius:4px;padding:6px 12px}
._iQIRiW{font-weight:600} ._ccwoMK{margin-top:16px;color:var(--ok);min-height:1.5em}</style></head>
<body>
<header class="site"><a href="index.html">Лабораторний стенд Testim</a><span class="ver">catalog (динамічні класи) — ітерація 3</span></header>
<main>
<div style="display:flex;justify-content:space-between;align-items:baseline">
  <h1>Каталог</h1><span class="_iQIRiW">Кошик: 0</span></div>
<table class="_UDMbWR"><thead><tr><th>Товар</th><th>Ціна</th><th></th></tr></thead><tbody>
    <tr class="_aH7x3G"><td class="_gjZT3k">Монітор Vista 27</td><td class="_9LRgFL">11 499 грн</td><td><button class="_crAMpo" data-name="Монітор Vista 27">Додати до кошика</button></td></tr>
    <tr class="_aH7x3G"><td class="_gjZT3k">Клавіатура Tact K8</td><td class="_9LRgFL">2 799 грн</td><td><button class="_crAMpo" data-name="Клавіатура Tact K8">Додати до кошика</button></td></tr>
    <tr class="_aH7x3G"><td class="_gjZT3k">Ноутбук Aurora 14</td><td class="_9LRgFL">42 999 грн</td><td><button class="_crAMpo" data-name="Ноутбук Aurora 14">Додати до кошика</button></td></tr>
    <tr class="_aH7x3G"><td class="_gjZT3k">Навушники Drift H7</td><td class="_9LRgFL">3 299 грн</td><td><button class="_crAMpo" data-name="Навушники Drift H7">Додати до кошика</button></td></tr>
    <tr class="_aH7x3G"><td class="_gjZT3k">Бездротова миша Orbit M2</td><td class="_9LRgFL">899 грн</td><td><button class="_crAMpo" data-name="Бездротова миша Orbit M2">Додати до кошика</button></td></tr>
    <tr class="_aH7x3G"><td class="_gjZT3k">Вебкамера Lens 4K</td><td class="_9LRgFL">2 199 грн</td><td><button class="_crAMpo" data-name="Вебкамера Lens 4K">Додати до кошика</button></td></tr>
</tbody></table>
<div class="_ccwoMK" role="status"></div>
</main>
<script>var n=0;
document.querySelectorAll('button[data-name]').forEach(function(b){b.addEventListener('click',function(){
 n++; document.querySelector('._iQIRiW').textContent='Кошик: '+n;
 document.querySelector('._ccwoMK').textContent=b.getAttribute('data-name')+' додано до кошика';});});</script>
</body></html>
