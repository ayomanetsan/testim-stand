<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід</title>
<style>
:root{--ink:#1d2433;--muted:#5b6475;--line:#d5dae3;--bg:#f6f7f9;--surface:#fff;--brand:#1f5fd1;--brand-ink:#fff;--ok:#1d7a46;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.site{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header.site a{color:var(--ink);text-decoration:none;font-weight:600}
main{max-width:960px;margin:32px auto;padding:0 20px}
h1{font-size:1.6rem;margin:0 0 16px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #8fb3f5;outline-offset:2px}
.msg{margin-top:16px;padding:10px 14px;border-radius:6px;display:none}
.msg.show{display:block}
.msg.ok{background:#e3f4ea;color:var(--ok)}
.msg.err{background:#fde8e6;color:var(--err)}
.ver{font-size:.8rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:400px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit}

.form-actions{margin-top:22px}
.btn-primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:10px 22px;font-weight:600}
</style></head>
<body>
<header class="site"><a href="index.html">Лабораторний стенд Testim</a><span class="ver">login v1 — оригінал</span></header>
<main>
<h1>Вхід до кабінету</h1>
<div class="panel">
  <form class="login-form">
    <label for="f-user">Логін</label>
    <input id="f-user" name="username" autocomplete="username">
    <label for="f-pass">Пароль</label>
    <input id="f-pass" name="password" type="password" autocomplete="current-password">
    <div class="form-actions">
      <button type="submit" id="login-btn" class="btn btn-primary">Увійти</button>
    </div>
  </form>
  <div id="result-ok" class="msg ok" role="status"></div>
<div id="result-err" class="msg err" role="alert"></div>
</div>
</main>
<script>
document.querySelector('form').addEventListener('submit', function(e){
  e.preventDefault();
  var u=document.querySelector('input[name=username]').value.trim();
  var p=document.querySelector('input[name=password]').value;
  var ok=document.getElementById('result-ok'), err=document.getElementById('result-err');
  ok.classList.remove('show'); err.classList.remove('show');
  if(u==='student' && p==='lab2026'){ ok.textContent='Вітаємо, '+u+'! Вхід виконано.'; ok.classList.add('show'); }
  else { err.textContent='Невірний логін або пароль.'; err.classList.add('show'); }
});
</script>
</body></html>
