<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог</title>
<style>
:root{--ink:#1d2433;--muted:#5b6475;--line:#d5dae3;--bg:#f6f7f9;--surface:#fff;--brand:#1f5fd1;--brand-ink:#fff;--ok:#1d7a46;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.site{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header.site a{color:var(--ink);text-decoration:none;font-weight:600}
main{max-width:960px;margin:32px auto;padding:0 20px}
h1{font-size:1.6rem;margin:0 0 16px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #8fb3f5;outline-offset:2px}
.msg{margin-top:16px;padding:10px 14px;border-radius:6px;display:none}
.msg.show{display:block}
.msg.ok{background:#e3f4ea;color:var(--ok)}
.msg.err{background:#fde8e6;color:var(--err)}
.ver{font-size:.8rem;color:var(--muted)}
._fLpqnx{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
._8B7FwR{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
._CwdwOh{font-weight:600} ._6pnqKP{font-size:1.1rem}
._WLJ4ww{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:8px 14px;margin-top:auto}
._y7qfDc{font-weight:600} ._Aw3N96{margin-top:16px;color:var(--ok);min-height:1.5em}</style></head>
<body>
<header class="site"><a href="index.html">Лабораторний стенд Testim</a><span class="ver">catalog (data-testid) — ітерація 0</span></header>
<main>
<div style="display:flex;justify-content:space-between;align-items:baseline">
  <h1>Каталог</h1><span id="cart" class="_y7qfDc" data-testid="cart-count">Кошик: 0</span></div>
<div class="_fLpqnx">
    <div class="_8B7FwR" data-testid="product-card-p101"><div class="_CwdwOh"><span class="_A7BEG7">Ноутбук Aurora 14</span></div><div class="_6pnqKP">42 999 грн</div><button class="_WLJ4ww" data-testid="add-to-cart-p101" data-name="Ноутбук Aurora 14">Додати до кошика</button></div>
    <div class="_8B7FwR" data-testid="product-card-p102"><div class="_CwdwOh"><span class="_A7BEG7">Монітор Vista 27</span></div><div class="_6pnqKP">11 499 грн</div><button class="_WLJ4ww" data-testid="add-to-cart-p102" data-name="Монітор Vista 27">Додати до кошика</button></div>
    <div class="_8B7FwR" data-testid="product-card-p103"><div class="_CwdwOh"><span class="_A7BEG7">Бездротова миша Orbit M2</span></div><div class="_6pnqKP">899 грн</div><button class="_WLJ4ww" data-testid="add-to-cart-p103" data-name="Бездротова миша Orbit M2">Додати до кошика</button></div>
    <div class="_8B7FwR" data-testid="product-card-p104"><div class="_CwdwOh"><span class="_A7BEG7">Клавіатура Tact K8</span></div><div class="_6pnqKP">2 799 грн</div><button class="_WLJ4ww" data-testid="add-to-cart-p104" data-name="Клавіатура Tact K8">Додати до кошика</button></div>
    <div class="_8B7FwR" data-testid="product-card-p105"><div class="_CwdwOh"><span class="_A7BEG7">Навушники Drift H7</span></div><div class="_6pnqKP">3 299 грн</div><button class="_WLJ4ww" data-testid="add-to-cart-p105" data-name="Навушники Drift H7">Додати до кошика</button></div>
    <div class="_8B7FwR" data-testid="product-card-p106"><div class="_CwdwOh"><span class="_A7BEG7">Вебкамера Lens 4K</span></div><div class="_6pnqKP">2 199 грн</div><button class="_WLJ4ww" data-testid="add-to-cart-p106" data-name="Вебкамера Lens 4K">Додати до кошика</button></div>
</div>
<div id="toast" class="_Aw3N96" role="status" data-testid="cart-toast"></div>
</main>
<script>var n=0;
document.querySelectorAll('button[data-name]').forEach(function(b){b.addEventListener('click',function(){
 n++; document.getElementById('cart').textContent='Кошик: '+n;
 document.getElementById('toast').textContent=b.getAttribute('data-name')+' додано до кошика';});});</script>
</body></html>
